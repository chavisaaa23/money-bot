<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกรายการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #FFF8F6; --card: #FFFFFF; --ink: #3D2C2E; --sub: #8A7A7C; --line: #F1E2E6;
    --pink: #E86A92; --pink-soft: #FBEAF0; --green: #1D9E75; --green-soft: #E1F5EE;
    --purple: #7F77DD; --purple-soft: #EEEDFE; --err: #C2410C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Mali', system-ui, sans-serif; font-size: 16px; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 120px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  header img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--pink-soft); }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header p { margin: 0; font-size: 13px; color: var(--sub); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--pink-soft); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 600; padding: 10px; border-radius: 999px; color: var(--sub); }
  .seg button.on { background: var(--card); color: var(--pink); box-shadow: 0 1px 3px rgba(232,106,146,.25); }
  .seg button.on.inc { color: var(--green); }
  .label { font-size: 14px; font-weight: 600; margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .label small { font-weight: 400; color: var(--sub); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { border: 2px solid transparent; background: var(--card); border-radius: 16px; padding: 4px; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s; }
  .tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; display: block; }
  .tile .noimg { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--pink-soft); border-radius: 12px; }
  .tile span { display: block; font-size: 12px; color: var(--sub); padding: 2px 0 4px; }
  .tile.on { border-color: var(--pink); transform: scale(1.03); background: var(--pink-soft); }
  .inc-mode .tile.on { border-color: var(--green); background: var(--green-soft); }
  .goal-zone { margin-top: 14px; background: var(--green-soft); border: 2px dashed #5DCAA5; border-radius: 18px; padding: 10px; }
  .goal-zone h3 { margin: 0 0 8px; font-size: 14px; color: #085041; display: flex; align-items: center; gap: 6px; }
  .goal-zone h3 small { font-weight: 400; color: #0F6E56; }
  .goal-zone .tile { background: #fff; position: relative; }
  .goal-zone .tile.on { border-color: var(--green); background: #fff; }
  .goal-zone .tile::after { content: '🎯 เข้าเป้าหมาย'; position: absolute; top: 4px; left: 4px; font-size: 10px; background: #1D9E75; color: #fff; padding: 2px 6px; border-radius: 999px; }
  .amount { display: flex; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 4px 16px; }
  .amount:focus-within { border-color: var(--pink); }
  .amount input { border: 0; outline: 0; font: inherit; font-size: 32px; font-weight: 700; width: 100%; padding: 6px 0; color: var(--ink); background: transparent; }
  .amount b { font-size: 22px; color: var(--sub); }
  .field { width: 100%; font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); color: var(--ink); outline: 0; }
  .field:focus { border-color: var(--pink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px 4px 4px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; }
  .chip img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: top; }
  .chip.plain { padding: 8px 14px; }
  .chip.on { border-color: var(--pink); background: var(--pink-soft); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .err { color: var(--err); font-size: 13px; margin-top: 6px; min-height: 0; }
  .hide { display: none !important; }
  .save { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(255,248,246,0)); }
  .save button { display: block; width: 100%; max-width: 448px; margin: 0 auto; border: 0; border-radius: 999px; padding: 14px; font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--pink); box-shadow: 0 4px 12px rgba(232,106,146,.35); }
  .inc-mode .save button { background: var(--green); box-shadow: 0 4px 12px rgba(29,158,117,.3); }
  .save button:disabled { opacity: .6; }
  .done { position: fixed; inset: 0; background: rgba(255,248,246,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 24px; }
  .done img { width: 180px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .done h2 { margin: 8px 0 0; font-size: 22px; }
  .done p { margin: 0; color: var(--sub); }
  .preview { white-space: pre-wrap; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; font-size: 13px; text-align: left; margin-top: 12px; max-width: 320px; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<main id="app">
  <header>
    <img src="icons/12_savings.png" alt="">
    <div><h1>บันทึกรายการ</h1><p id="hello">วันนี้ใช้อะไรไปบ้างคะ ✨</p></div>
  </header>

  <div class="seg" role="tablist">
    <button type="button" class="on" data-type="รายจ่าย">รายจ่าย</button>
    <button type="button" data-type="รายรับ">รายรับ</button>
  </div>

  <div class="label">เลือกหมวด <small id="catName"></small></div>
  <div id="cats"></div>
  <div class="err" id="errCat"></div>

  <div class="label">จำนวนเงิน</div>
  <label class="amount"><input id="amount" inputmode="decimal" placeholder="0" autocomplete="off"><b>฿</b></label>
  <div class="err" id="errAmt"></div>

  <div class="label">ชื่อรายการ <small>ไม่ใส่ก็ได้</small></div>
  <input class="field" id="item" placeholder="เช่น ชาไข่มุก" maxlength="60">

  <div id="chBox">
    <div class="label" id="chLabel">ช่องทางจ่าย</div>
    <div class="chips" id="channels"></div>
  </div>

  <div class="label">วันที่</div>
  <div class="row">
    <input class="field" type="date" id="date">
    <div class="chips"><button type="button" class="chip plain" data-day="0">วันนี้</button><button type="button" class="chip plain" data-day="-1">เมื่อวาน</button></div>
  </div>

  <div id="goalBox" class="hide">
    <div class="label">เข้าเป้าหมาย <small>🎯</small></div>
    <select class="field" id="goal"></select>
  </div>

  <div class="label">โน้ต <small>ไม่ใส่ก็ได้</small></div>
  <input class="field" id="note" maxlength="100" placeholder="เช่น กับเพื่อนที่ทำงาน">
</main>

<div class="save"><button type="button" id="saveBtn">บันทึก 💕</button></div>
<div class="done hide" id="done"><img id="doneImg" src="icons/12_savings.png" alt=""><h2 id="doneTitle">บันทึกแล้ว!</h2><p id="doneSub"></p><div id="doneMsg"></div></div>

<script>
// ───── ตั้งค่า: แก้ 2 บรรทัดนี้หลังสร้าง LIFF และ Deploy Apps Script ─────
const LIFF_ID = '2012462044-ZTwGDogQ';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyxColHGdJMrIHsuxCPRVN1R8sOUJocnV-4qIPMgF_d1oQVfWt9k3OSCNqHK6ONWTrZ/exec';   // ลงท้ายด้วย /exec
// ────────────────────────────────────────────────────────────────

const FORM_HEADER = '📝 บันทึกผ่านฟอร์ม';
const DEFAULT_CONFIG = {
  categories: [
    ['กินเที่ยว+ดำรงชีวิต','รายจ่าย','Needs','01_food_travel.png'],['ค่ารถ','รายจ่าย','Needs','02_car.png'],
    ['การเดินทาง','รายจ่าย','Needs','03_transport.png'],['ค่าโทรศัพท์','รายจ่าย','Needs','04_phone.png'],
    ['ค่าประกันสุขภาพป๋า','รายจ่าย','Needs','05_insurance_dad.png'],['ภาษีประจำเดือน','รายจ่าย','Needs','06_tax.png'],
    ['สุขภาพ','รายจ่าย','Needs','07_health.png'],['สอบเข้าป.โท','รายจ่าย','Needs','08_master_exam.png'],
    ['ครีม,ดูแลตัวเอง/เสื้อผ้า','รายจ่าย','Wants','09_beauty_clothes.png'],['เครื่องดื่ม','รายจ่าย','Wants','10_drinks.png'],
    ['อื่นๆ','รายจ่าย','Wants','11_other.png'],['บ้าน','รายจ่าย','Needs','13_home.png'],
    ['เก็บออม','รายจ่าย','Savings','12_savings.png'],['ลงทุน','รายจ่าย','Invest',''],['จ่ายบัตรเครดิต','รายจ่าย','Transfer','14_credit_card_payment.png'],
    ['เงินเดือน','รายรับ','Income','15_income.png'],['โบนัส','รายรับ','Income','15_income.png'],['รายรับอื่นๆ','รายรับ','Income','15_income.png']
  ].map(([name, type, group, icon]) => ({ name, type, group, icon })),
  channels: [{ name: 'โอน', isDefault: true, icon: 'ch_transfer.png' }, { name: 'บัตร KTC', icon: 'ch_credit.png', isCard: true },
    { name: 'บัตร SCB', icon: 'ch_credit.png', isCard: true }, { name: 'บัตร Bangkok Bank', icon: 'ch_credit.png', isCard: true }],
  goals: [{ name: 'ปลดหนี้บัตรเครดิต', category: 'จ่ายบัตรเครดิต' }, { name: 'เที่ยวญี่ปุ่น', category: 'เก็บออม' }]
};
const LABELED = new Set(['รายจ่าย']); // รูปหมวดรายจ่ายมีป้ายชื่อในรูปแล้ว
const GOAL_GROUPS = ['Savings', 'Invest', 'Transfer']; // หมวดที่เข้าเป้าหมาย แสดงแยกในกรอบสีเขียว

let cfg = DEFAULT_CONFIG, state = { type: 'รายจ่าย', cat: null, channel: null }, inLine = false;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const isoDay = off => { const d = new Date(); d.setDate(d.getDate() + off); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function renderCats() {
  document.body.classList.toggle('inc-mode', state.type === 'รายรับ');
  const list = cfg.categories.filter(c => c.type === state.type);
  const tile = c => `
    <button type="button" class="tile${state.cat === c.name ? ' on' : ''}" data-cat="${c.name}" aria-label="${c.name}">
      ${c.icon ? `<img src="icons/${c.icon}" alt="" loading="lazy">` : `<div class="noimg">${c.name}</div>`}
      ${LABELED.has(c.type) && c.icon || !c.icon ? '' : `<span>${c.name}</span>`}
    </button>`;
  const normal = list.filter(c => !GOAL_GROUPS.includes(c.group)), special = list.filter(c => GOAL_GROUPS.includes(c.group));
  $('cats').innerHTML = `<div class="grid">${normal.map(tile).join('')}</div>` +
    (special.length ? `<div class="goal-zone"><h3>🎯 เข้าเป้าหมาย <small>ออม · ลงทุน · จ่ายหนี้</small></h3><div class="grid">${special.map(tile).join('')}</div></div>` : '');
  $('catName').textContent = state.cat || '';
  $('chBox').classList.toggle('hide', state.type === 'รายรับ');
  renderGoals(); renderChannels();
}
function channelChoices() {
  const cat = cfg.categories.find(c => c.name === state.cat);
  if (cat && cat.group === 'Transfer') return cfg.channels.filter(c => c.isCard);       // จ่ายบัตร: เลือกบัตรที่จะจ่าย
  if (cat && GOAL_GROUPS.includes(cat.group)) return cfg.channels.filter(c => !c.isCard); // ออม/ลงทุน: เงินจากบัญชี
  return cfg.channels;
}
function renderChannels() {
  const list = channelChoices(), isPay = (cfg.categories.find(c => c.name === state.cat) || {}).group === 'Transfer';
  if (!list.some(c => c.name === state.channel)) state.channel = ((isPay ? list[0] : list.find(c => c.isDefault)) || list[0] || {}).name;
  $('chLabel').textContent = isPay ? 'จ่ายบัตรใบไหน' : 'ช่องทางจ่าย';
  $('channels').innerHTML = list.map(c => `
    <button type="button" class="chip${state.channel === c.name ? ' on' : ''}" data-ch="${c.name}">
      <img src="icons/${c.icon || 'ch_transfer.png'}" alt="">${c.name}
    </button>`).join('');
}
function renderGoals() {
  const goals = cfg.goals.filter(g => g.category === state.cat);
  $('goalBox').classList.toggle('hide', !goals.length);
  $('goal').innerHTML = goals.map(g => `<option>${g.name}</option>`).join('') + '<option value="">ไม่ระบุ</option>';
}

$('cats').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  state.cat = t.dataset.cat; $('errCat').textContent = ''; renderCats();
  setTimeout(() => $('amount').focus(), 150);
});
$('channels').addEventListener('click', e => {
  const t = e.target.closest('.chip'); if (!t) return;
  state.channel = t.dataset.ch; renderChannels();
});
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  b.classList.toggle('inc', b.dataset.type === 'รายรับ');
  state.type = b.dataset.type; state.cat = null; renderCats();
});
document.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => { $('date').value = isoDay(+b.dataset.day); }));
$('amount').addEventListener('input', e => {
  let v = e.target.value.replace(/[^\d.]/g, '');
  const parts = v.split('.'); if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  if (parts[1] && parts[1].length > 2) v = parts[0] + '.' + parts[1].slice(0, 2);
  e.target.value = v; $('errAmt').textContent = '';
});

function buildMessage() {
  const [y, m, d] = $('date').value.split('-');
  const lines = [FORM_HEADER, `ประเภท: ${state.type}`, `หมวด: ${state.cat}`,
    `รายการ: ${($('item').value.trim() || state.cat).replace(/\n/g, ' ')}`, `จำนวน: ${$('amount').value}`];
  if (state.type === 'รายจ่าย') lines.push(`ช่องทาง: ${state.channel}`);
  lines.push(`วันที่: ${d}/${m}/${+y + 543}`);
  if (!$('goalBox').classList.contains('hide') && $('goal').value) lines.push(`เป้าหมาย: ${$('goal').value}`);
  if ($('note').value.trim()) lines.push(`โน้ต: ${$('note').value.trim().replace(/\n/g, ' ')}`);
  return lines.join('\n');
}

$('saveBtn').addEventListener('click', async () => {
  let ok = true;
  if (!state.cat) { $('errCat').textContent = 'เลือกหมวดก่อนนะคะ'; ok = false; }
  const amt = parseFloat($('amount').value);
  if (!(amt > 0)) { $('errAmt').textContent = 'ใส่จำนวนเงินด้วยค่ะ'; ok = false; }
  if (!ok) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const text = buildMessage(), btn = $('saveBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  const cat = cfg.categories.find(c => c.name === state.cat);
  $('doneImg').src = 'icons/' + (cat && cat.icon || '12_savings.png');
  $('doneTitle').textContent = state.type === 'รายรับ' ? 'รับเงินแล้ว! 💰' : 'บันทึกแล้ว! ✓';
  $('doneSub').textContent = `${$('item').value.trim() || state.cat} ${Number(amt).toLocaleString('th-TH')} ฿`;
  try {
    if (inLine) {
      // บันทึกตรงเข้า Sheet ไม่ส่งข้อความเข้าแชท (ถ้าบันทึกตรงไม่สำเร็จ ค่อยส่งผ่านแชทแทน)
      let r = null;
      try {
        const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'save', token: liff.getAccessToken(), text }) });
        r = await res.json();
      } catch (e) { r = null; }
      if (r && r.ok) {
        const fmt = n => Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
        $('doneMsg').innerHTML = '<p></p>';
        $('doneMsg').querySelector('p').textContent = r.cardLeft != null ? `หนี้${state.channel} คงเหลือ ${fmt(r.cardLeft)} ฿`
          : r.goal ? `🎯 เข้าเป้าหมาย ${r.goal}` : `เดือนนี้ใช้ไป ${fmt(r.spent)} ฿`;
      } else if (r) {
        await liff.sendMessages([{ type: 'text', text }]); // เซิร์ฟเวอร์ตอบว่าไม่ผ่าน → ส่งผ่านแชทให้บอทจัดการ
      } else {
        throw new Error('เชื่อมต่อไม่ได้ (อาจบันทึกไปแล้ว) พิมพ์ "วันนี้" ในแชทเพื่อเช็กก่อนส่งซ้ำ');
      }
      $('done').classList.remove('hide');
      setTimeout(() => liff.closeWindow(), 1600);
    } else {
      $('doneMsg').innerHTML = '<div class="preview"></div><p style="margin-top:8px;font-size:12px">โหมดทดลอง: เปิดนอกไลน์ ข้อความด้านบนจะถูกส่งเข้าแชทเมื่อเปิดผ่าน LINE</p>';
      $('doneMsg').querySelector('.preview').textContent = text;
      $('done').classList.remove('hide');
      $('done').onclick = () => { $('done').classList.add('hide'); btn.disabled = false; btn.textContent = 'บันทึก 💕'; };
    }
  } catch (err) {
    btn.disabled = false; btn.textContent = 'บันทึก 💕';
    alert('ส่งไม่สำเร็จ: ' + (err.message || err) + '\nเปิดฟอร์มจากปุ่มเมนูในแชทบอทแล้วลองใหม่นะคะ');
  }
});

async function loadConfig() {
  if (!GAS_URL.startsWith('https://')) return;
  try {
    const r = await fetch(GAS_URL + '?action=config');
    const j = await r.json();
    if (j.categories && j.categories.length) cfg = j;
  } catch (e) { /* ใช้ค่าตั้งต้นในไฟล์ */ }
}

(async function init() {
  $('date').value = isoDay(0);
  await loadConfig();
  state.channel = (cfg.channels.find(c => c.isDefault) || cfg.channels[0] || {}).name;
  renderCats(); renderChannels();
  if (typeof liff !== 'undefined' && LIFF_ID !== 'YOUR_LIFF_ID') {
    try {
      await liff.init({ liffId: LIFF_ID });
      inLine = liff.isInClient();
      if (inLine) { const p = await liff.getProfile(); $('hello').textContent = `สวัสดี ${p.displayName} วันนี้ใช้อะไรไปบ้างคะ ✨`; }
    } catch (e) { console.warn(e); }
  }
})();
</script>
</body>
</html>
